name: "Feature Request / 功能建议"
description: "Suggest a new feature or improvement / 建议新功能或改进"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提出功能建议！请描述你的需求和使用场景。
        Feature requests are welcome! Please describe your need and use case.

  - type: textarea
    id: motivation
    attributes:
      label: Motivation / 动机
      description: Why is this needed? What problem does it solve? / 为什么需要这个功能？解决什么问题？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution / 建议方案
      description: How should this work? / 你希望这个功能怎么工作？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered / 备选方案
      description: Any other approaches you thought about? / 是否考虑过其他方案？
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context / 补充信息
      description: Screenshots, references, or related issues.
    validations:
      required: false
