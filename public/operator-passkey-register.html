<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Operator Passkey Registration</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
.container { max-width: 520px; width: 100%; padding: 40px; background: #1e293b; border-radius: 12px; margin: 20px; }
h1 { font-size: 22px; margin-bottom: 6px; }
.subtitle { color: #94a3b8; font-size: 14px; margin-bottom: 28px; }
label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 6px; margin-top: 16px; }
input { width: 100%; padding: 10px 12px; border: 1px solid #334155; border-radius: 8px; background: #0f172a; color: #e2e8f0; font-size: 14px; }
input:focus { outline: none; border-color: #3b82f6; }
button { width: 100%; margin-top: 24px; padding: 12px; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.15s; }
#unlock-btn { background: #7c3aed; color: white; }
#unlock-btn:hover { background: #6d28d9; }
#register-btn { background: #2563eb; color: white; display: none; }
#register-btn:hover { background: #1d4ed8; }
button:disabled { background: #334155; color: #64748b; cursor: not-allowed; }
.status { margin-top: 20px; padding: 14px; border-radius: 8px; font-size: 14px; line-height: 1.5; display: none; }
.status.success { display: block; background: #064e3b; color: #6ee7b7; border: 1px solid #065f46; }
.status.error { display: block; background: #450a0a; color: #fca5a5; border: 1px solid #7f1d1d; }
.status.info { display: block; background: #1e3a5f; color: #93c5fd; border: 1px solid #1e40af; }
.rp-info { margin-top: 20px; padding: 12px; background: #0f172a; border-radius: 8px; font-size: 12px; color: #64748b; }
.rp-info span { color: #94a3b8; }
.warning { margin-top: 16px; padding: 12px; background: #451a03; color: #fbbf24; border: 1px solid #78350f; border-radius: 8px; font-size: 13px; }
#key-section { display: block; }
#register-section { display: none; }
.denied { color: #fca5a5; font-size: 14px; margin-top: 20px; }
</style>
</head>
<body>
<div class="container">
  <h1>Operator Passkey Registration</h1>
  <p class="subtitle">Register a passkey credential for the public deployment RP.</p>

  <div id="key-section">
    <label for="operator-key">Operator Registration Key</label>
    <input type="password" id="operator-key" placeholder="Enter operator registration key" autocomplete="off">
    <button id="unlock-btn" onclick="unlock()">Unlock</button>
    <div id="key-status" class="status"></div>
  </div>

  <div id="register-section">
    <label for="device-name">Device Name</label>
    <input type="text" id="device-name" placeholder="e.g. MacBook Pro, iPhone" value="MacBook Air">
    <button id="register-btn" onclick="register()">Register Passkey</button>
    <div id="reg-status" class="status"></div>
  </div>

  <div class="rp-info">
    <div>RP ID: <span id="rp-id">loading...</span></div>
    <div>Origin: <span id="rp-origin">loading...</span></div>
    <div>API: <span id="api-url">loading...</span></div>
  </div>

  <div class="warning">
    This page is for operator use only. It replaces any existing passkey credential in a single transaction.
  </div>
</div>

<script>
(function() {
  var loc = window.location;
  var hostname = loc.hostname;

  var API_BASE;
  if (hostname === 'blog.limengyang.me') {
    API_BASE = 'https://public-api.limengyang.me';
  } else if (hostname === 'localhost' || hostname === '127.0.0.1') {
    API_BASE = loc.protocol + '//localhost:8000';
  } else {
    API_BASE = loc.protocol + '//' + hostname + ':8000';
  }

  document.getElementById('rp-id').textContent = hostname;
  document.getElementById('rp-origin').textContent = loc.origin;
  document.getElementById('api-url').textContent = API_BASE;

  window._apiBase = API_BASE;
  window._operatorKey = null;
  window._sessionId = null;
})();

function b64urlEncode(buffer) {
  var bytes = new Uint8Array(buffer);
  var binary = '';
  for (var i = 0; i < bytes.length; i++) {
    binary += String.fromCharCode(bytes[i]);
  }
  return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

function b64urlDecode(str) {
  str = str.replace(/-/g, '+').replace(/_/g, '/');
  var pad = str.length % 4;
  if (pad) str += '='.repeat(4 - pad);
  var binary = atob(str);
  var bytes = new Uint8Array(binary.length);
  for (var i = 0; i < binary.length; i++) {
    bytes[i] = binary.charCodeAt(i);
  }
  return bytes.buffer;
}

async function unlock() {
  var keyInput = document.getElementById('operator-key');
  var keyStatus = document.getElementById('key-status');
  var unlockBtn = document.getElementById('unlock-btn');
  var operatorKey = keyInput.value.trim();

  if (!operatorKey) {
    keyStatus.className = 'status error';
    keyStatus.textContent = 'Operator registration key is required.';
    return;
  }

  unlockBtn.disabled = true;
  keyStatus.className = 'status info';
  keyStatus.textContent = 'Validating key...';

  try {
    var res = await fetch(window._apiBase + '/api/auth/passkey/operator/validate-key', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Operator-Registration-Key': operatorKey,
      },
    });

    if (!res.ok) {
      var errBody = await res.json().catch(function() { return {}; });
      throw new Error(errBody.detail || 'Key rejected (' + res.status + ')');
    }

    window._operatorKey = operatorKey;
    keyStatus.className = 'status success';
    keyStatus.textContent = 'Key accepted. Registration form unlocked.';
    document.getElementById('key-section').querySelector('input').disabled = true;
    unlockBtn.style.display = 'none';
    document.getElementById('register-section').style.display = 'block';
    document.getElementById('register-btn').style.display = 'block';
  } catch (e) {
    keyStatus.className = 'status error';
    keyStatus.textContent = 'Access denied: ' + e.message;
    unlockBtn.disabled = false;
  }
}

async function register() {
  var btn = document.getElementById('register-btn');
  var status = document.getElementById('reg-status');
  var deviceName = document.getElementById('device-name').value.trim() || 'Operator Device';

  if (!window._operatorKey) {
    status.className = 'status error';
    status.textContent = 'Key not validated. Reload and unlock first.';
    return;
  }

  btn.disabled = true;
  status.className = 'status info';
  status.textContent = 'Requesting registration options...';

  try {
    var optsRes = await fetch(window._apiBase + '/api/auth/passkey/operator/reg-options', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Operator-Registration-Key': window._operatorKey,
      },
      body: JSON.stringify({ device_name: deviceName }),
    });

    if (!optsRes.ok) {
      var errBody = await optsRes.json().catch(function() { return {}; });
      throw new Error('Failed to get registration options: ' + (errBody.detail || optsRes.status));
    }

    var data = await optsRes.json();
    var publicKey = data.options.publicKey;
    window._sessionId = data.session_id;

    publicKey.challenge = b64urlDecode(publicKey.challenge);
    publicKey.user.id = b64urlDecode(publicKey.user.id);

    status.textContent = 'Please complete the passkey prompt on your device...';

    var cred = await navigator.credentials.create({ publicKey: publicKey });

    var attestation = {
      id: cred.id,
      rawId: b64urlEncode(cred.rawId),
      type: cred.type,
      response: {
        clientDataJSON: b64urlEncode(cred.response.clientDataJSON),
        attestationObject: b64urlEncode(cred.response.attestationObject),
      },
    };

    status.textContent = 'Verifying registration with backend...';

    var verifyRes = await fetch(window._apiBase + '/api/auth/passkey/operator/register', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Operator-Registration-Key': window._operatorKey,
      },
      body: JSON.stringify({
        attestation: attestation,
        session_id: window._sessionId,
        device_name: deviceName,
      }),
    });

    var result = await verifyRes.json();

    if (result.success) {
      status.className = 'status success';
      status.innerHTML = 'Passkey registered successfully!<br>Device: ' + deviceName + '<br>You can close this page and log in at <a href="/manage" style="color:#6ee7b7">/manage</a>.';
    } else {
      status.className = 'status error';
      status.textContent = 'Registration failed: ' + (result.message || 'Unknown error');
      btn.disabled = false;
    }
  } catch (e) {
    status.className = 'status error';
    status.textContent = 'Error: ' + e.message;
    btn.disabled = false;
  }
}
</script>
</body>
</html>
